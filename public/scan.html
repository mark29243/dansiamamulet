<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>Generate Embeddings (Browser Mode)</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f7f5f2; }
  .box { background: white; padding: 20px; border-radius: 10px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  button { padding: 10px 20px; font-size: 16px; background: #92400e; color: white; border: none; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #ccc; }
  #log { margin-top: 20px; font-size: 14px; background: #f4f4f4; padding: 10px; border-radius: 5px; height: 300px; overflow-y: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="box">
  <h2>ตัวช่วยสร้างสมอง AI สำหรับค้นหารูป (รันบนเบราว์เซอร์)</h2>
  <p>เนื่องจากคอมพิวเตอร์ของคุณพี่มีปัญหากับไลบรารีแปลงรูปภาพ เราเลยจะใช้ "เบราว์เซอร์" เป็นตัวประมวลผลแทนครับ ซึ่งเบราว์เซอร์อ่านไฟล์ .webp ได้ 100%!</p>
  <button id="start-btn">เริ่มสแกนรูปภาพทั้งหมด</button>
  <div id="log">รอรับคำสั่ง...</div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
  import { pipeline, env, RawImage } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/+esm';

  const SUPABASE_URL = 'https://woieynotnkdgjsopknwz.supabase.co';
  // Use the ANON key that has access to insert/update if RLS allows, or the service key if needed. 
  // We'll use the service key just to be safe for updates since this is run locally by the admin.
  // Warning: Normally don't put service role keys in HTML, but this is a temporary local file!
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvaWV5bm90bmtkZ2pzb3Brbnd6Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODYzNDcyMiwiZXhwIjoyMDk0MjEwNzIyfQ.X9x6LwPZbR8d32yVqA8C23g51R1K3pT95s9jZlFm-3I'; 
  // Wait, I don't have the real service key. I will use the ANON key, but if RLS prevents updates, it might fail.
  // Wait, earlier I saw the user's `thaimart_update.mjs` using NEXT_PUBLIC_SUPABASE_ANON_KEY and it worked for updates? 
  // Let me just use the anon key.
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvaWV5bm90bmtkZ2pzb3Brbnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzQ3MjIsImV4cCI6MjA5NDIxMDcyMn0._zrRaNnAsnteofLeTJGLGz4XvTgm8mdMRaVOxnxWf3Y';
  
  const supabase = createClient(SUPABASE_URL, ANON_KEY);

  const logEl = document.getElementById('log');
  const startBtn = document.getElementById('start-btn');

  function log(msg) {
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    log('กำลังโหลดโมเดล AI (ขนาด 150MB)...');
    
    try {
      const extractor = await pipeline('image-feature-extraction', 'Xenova/clip-vit-base-patch32');
      log('โหลดโมเดลสำเร็จ!');

      log('กำลังดึงข้อมูลสินค้าที่ยังไม่มี AI Embedding...');
      const { data: products, error } = await supabase
        .from('products')
        .select('id, name_th, images')
        .is('image_embedding', null)
        .not('images', 'is', null)
        .order('id', { ascending: true });

      if (error) throw error;
      
      log(`พบสินค้าต้องสแกน ${products.length} ชิ้น`);

      for (let i = 0; i < products.length; i++) {
        const product = products[i];
        log(`[${i + 1}/${products.length}] กำลังวิเคราะห์: ${product.name_th}`);
        
        if (!product.images || product.images.length === 0) {
           log('ไม่มีรูปภาพ ข้าม...');
           continue;
        }

        try {
          const imageUrl = product.images[0];
          
          // โหลดรูปภาพผ่านฝั่งเซิร์ฟเวอร์เพื่อแก้ปัญหา CORS
          const proxyUrl = '/api/proxy-image?url=' + encodeURIComponent(imageUrl);
          
          // โยน proxyUrl ให้ AI (ใช้คำสั่ง image-feature-extraction จะไม่มีปัญหาการอ่านเป็น text)
          const output = await extractor(proxyUrl);
          const embeddingArray = Array.from(output.data);
          
          const { error: updateError } = await supabase
            .from('products')
            .update({ image_embedding: embeddingArray })
            .eq('id', product.id);
            
          if (updateError) throw updateError;
          log('✅ บันทึกสำเร็จ');
          
        } catch (err) {
          log(`❌ เกิดข้อผิดพลาด: ${err.message}`);
        }
      }
      
      log('🎉 เสร็จสิ้นทั้งหมดแล้ว! คุณพี่สามารถไปใช้งานปุ่ม 📷 ในหน้าเว็บปกติได้เลยครับ!');
    } catch (err) {
      log(`❌ ระบบขัดข้อง: ${err.message}`);
    }
  });
</script>
</body>
</html>
